<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog &amp; Newsletters | DrDPKlass</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:'Source Sans 3',sans-serif;background:#fafafa}
.blog-card{border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;height:100%;background:#fff}
.blog-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.blog-thumb{height:100px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.bc-body{padding:.9rem}
.bc-tag{font-size:.72rem;font-weight:600;text-transform:uppercase;display:inline-block;margin-bottom:.35rem;color:#0a4275;background:#e8f0fe;padding:.15rem .4rem;border-radius:4px}
.tag-policy{background:#fff3cd}.tag-career{background:#d4edda}.tag-esg{background:#d1e7dd}
.tag-sdgs{background:#cfe2ff}.tag-teaching{background:#f8d7da}.tag-ai{background:#e2d9f3}
.btn-read{display:inline-block;margin-top:.4rem;color:#0a4275;font-weight:600;text-decoration:none;font-size:.9rem}
.filter-btn{margin:.2rem}.filter-btn.active{background:#0a4275;color:#fff;border-color:#0a4275}
.bc-body h5{font-size:1rem;line-height:1.3;margin-bottom:.4rem}
</style>
</head>
<body>
<div class="container py-4">
<h1 style="color:#0a4275;font-size:1.75rem">Blog &amp; Newsletters</h1>
<p class="text-muted mb-1">Dr. Debasis Pahi | Ph.D. (IIT Kharagpur) | drdpklass.com</p>
<p class="small text-muted mb-3" id="status">Loading…</p>
<div class="mb-3">
<button class="btn btn-sm btn-outline-primary filter-btn active" data-filter="all">All</button>
<button class="btn btn-sm btn-outline-primary filter-btn" data-filter="research">Research</button>
<button class="btn btn-sm btn-outline-primary filter-btn" data-filter="esg">ESG</button>
<button class="btn btn-sm btn-outline-primary filter-btn" data-filter="sdgs">SDGs</button>
<button class="btn btn-sm btn-outline-primary filter-btn" data-filter="teaching">Teaching</button>
<button class="btn btn-sm btn-outline-primary filter-btn" data-filter="ai">AI &amp; Business</button>
<button class="btn btn-sm btn-outline-primary filter-btn" data-filter="policy">Policy</button>
<button class="btn btn-sm btn-outline-primary filter-btn" data-filter="career">Career</button>
</div>
<div class="row g-3" id="blogGrid"></div>
</div>
<script src="blogs/posts_a.js"></script>
<script src="blogs/posts_b.js"></script>
<script>
const POSTS = (typeof POSTS_A !== 'undefined' ? POSTS_A : []).concat(typeof POSTS_B !== 'undefined' ? POSTS_B : []);
POSTS.sort((a,b) => b[0].localeCompare(a[0]));
document.getElementById('status').textContent = POSTS.length + ' posts · Sep–Nov 2026';
const grid = document.getElementById('blogGrid');
grid.innerHTML = POSTS.map(p => {
  const [date, label, cat, series, tag, title, href] = p;
  return `<div class="col-md-6 col-lg-4" data-cat="${cat}"><div class="blog-card"><div class="blog-thumb" style="background:linear-gradient(135deg,#0a4275,#145da0);color:#ffc107"><i class="fas fa-book-open"></i></div><div class="bc-body"><span class="bc-tag ${tag}">${series} · ${label}</span><h5>${title}</h5><a class="btn-read" href="${href}" target="_blank" rel="noopener">Read the playbook</a></div></div></div>`;
}).join('');
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('#blogGrid > div').forEach(c => {
      c.style.display = (f === 'all' || c.dataset.cat === f) ? '' : 'none';
    });
  };
});
</script>
</body>
</html>
