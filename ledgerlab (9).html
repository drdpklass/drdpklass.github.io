<style>

    --surface: #17202c;
    --surface-2: #1e2839;
    --surface-3: #263349;
    --paper: #f1ead9;
    --paper-line: #d9cfb3;
    --ink: #241f14;
    --text-light: #e9e6dc;
    --muted: #8fa0b8;
    --muted-2: #5a6a82;
    --emerald: #3fae7a;
    --emerald-dim: rgba(63,174,122,0.15);
    --amber: #d6a339;
    --amber-dim: rgba(214,163,57,0.15);
    --rose: #c0524a;
    --rose-dim: rgba(192,82,74,0.15);
    --blue: #5b8dd6;
    --blue-dim: rgba(91,141,214,0.15);
    --purple: #9370c9;

    --serif: 'Iowan Old Style','Palatino Linotype','Book Antiqua', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background: var(--bg); color: var(--text-light);
    font-family: var(--sans); font-size: 14.5px; line-height:1.5;

  ::selection{ background: var(--emerald); color:#0a1410; }
  a{ color: var(--blue); }

  .brand{ padding: 4px 10px 20px; }
  .brand .mark{

  .brand .mark span{ color: var(--emerald); font-style:italic; font-size:15px; }
  .brand .sub{ font-size: 10.5px; color: var(--muted-2); text-transform:uppercase; letter-spacing:0.11em; margin-top:3px; }

  .navgroup-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.11em; color: var(--muted-2); padding: 6px 10px; }
  .navbtn{

    background:none; border:none; color: var(--muted); font-family:var(--sans);
    font-size:13.5px; padding:9px 10px; border-radius:8px; cursor:pointer;
    transition: background .15s, color .15s;

  .navbtn:hover{ background: rgba(255,255,255,0.04); color: var(--text-light); }
  .navbtn.active{ background: var(--surface-3); color: var(--text-light); }
  .navbtn .dot{ width:6px; height:6px; border-radius:50%; background: var(--muted-2); flex-shrink:0; }
  .navbtn.active .dot{ background: var(--emerald); }

  .sidebar-footer{ margin-top:auto; padding: 12px 10px; font-size:11px; color: var(--muted-2); border-top:1px solid rgba(255,255,255,0.06); }

  /* MAIN */
  .main{ padding: 30px 40px 80px; max-width:1100px; }
  .view-header{ margin-bottom: 22px; }
  .view-header h1{ font-family: var(--serif); font-weight:500; font-size:26px; margin:0 0 6px; color:var(--text-light); }
  .view-header p{ margin:0; color: var(--muted); max-width:640px; font-size:13.5px; }
  .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:0.13em; color: var(--emerald); margin-bottom:8px; font-weight:600; }

  /* CARDS */

  .kpi .value.pos{ color: var(--emerald); }
  .kpi .value.neg{ color: var(--rose); }

  .upi-box{ background:#0c1117; border:1px dashed rgba(255,255,255,0.15); border-radius:10px; padding:16px; text-align:center; margin:14px 0; }

  .pay-status.err{ background: var(--rose-dim); color: var(--rose); }
  .paid-strip{ display:none; background: var(--emerald-dim); color: var(--emerald); border:1px solid rgba(63,174,122,0.3); border-radius:7px; padding:11px 14px; font-size:13px; margin-top:14px; }

  /* ---------- Persistent copyright watermark ---------- */

  .disclaimer{ font-size:11.5px; color:var(--muted-2); border-top:1px solid rgba(255,255,255,0.08); margin-top:34px; padding-top:16px; line-height:1.6; }

  select[multiple]{ height:auto; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--surface-3); border-radius:4px; }

  @media (max-width: 880px){

    .sidebar{ position:relative; height:auto; flex-direction:row; overflow-x:auto; }
    .navgroup{ display:flex; gap:4px; margin-top:0; }

    .kpi-grid, .form-grid{ grid-template-columns:1fr; }

  }
</style>

<script>
/* ==================== STORAGE ==================== */
const STORAGE_KEY = 'ledgerlab-state-v1';
const Storage = {
  async get(key){
    try{ if (window.storage){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){}
    return null;
  },
  async set(key, value){
    try{ if (window.storage){ await window.storage.set(key, JSON.stringify(value)); return true; } }catch(e){}
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ return false; }
  }
};

/* ==================== CONFIG — payments & verification ====================
   Replace these two values to wire this lab up to a real UPI account and a
   real Google Sheet. Everything works in "demo mode" (instant free unlock)
   until GAS_ENDPOINT is filled in — see the Setup Guide on the
   Certification Pack tab for the exact Google Apps Script to deploy. */
const UPI_ID = 'debasis.pahi@ybl';
const UPI_PAYEE_NAME = 'Dr. Debasis Pahi';
const PRICE_INR = 49;
const GAS_ENDPOINT = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';


async function loadState(){
  const saved = await Storage.get(STORAGE_KEY);
  if (saved) state = saved;
}
async function saveState(){ await Storage.set(STORAGE_KEY, state); }

/* ==================== HELPERS ==================== */
function fmt(n){
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  return v.toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function acctByCode(code){ return state.accounts.find(a => a.code === code); }
function acctLabel(a){ return a.code + ' · ' + a.name; }
function badgeClass(type){ return type.toLowerCase(); }
function isDebitNormal(type){ return type === 'Asset' || type === 'Expense'; }

// net debit-side balance for an account (positive = debit balance, negative = credit balance)
function accountNetDebit(code){
  let dr = 0, cr = 0;
  state.entries.forEach(e => e.lines.forEach(l => {
    if (l.code === code){ dr += l.debit || 0; cr += l.credit || 0; }
  }));
  return dr - cr;
}
function accountVendorBalance(vendorId){
  // positive = amount owed to vendor (credit balance on AP sub-ledger)
  let dr = 0, cr = 0;
  state.entries.forEach(e => e.lines.forEach(l => {
    if (l.vendorId === vendorId){ dr += l.debit || 0; cr += l.credit || 0; }
  }));
  return cr - dr;
}
function customerBalance(customerId){
  // positive = amount owed by customer (debit balance on AR sub-ledger)
  let dr = 0, cr = 0;
  state.entries.forEach(e => e.lines.forEach(l => {
    if (l.customerId === customerId){ dr += l.debit || 0; cr += l.credit || 0; }
  }));
  return dr - cr;
}
function totalsByType(type){
  return state.accounts.filter(a => a.type === type)
    .reduce((sum,a) => sum + Math.abs(accountNetDebit(a.code)), 0);
}
function netIncome(){
  const rev = state.accounts.filter(a=>a.type==='Revenue').reduce((s,a)=> s - accountNetDebit(a.code), 0);
  const exp = state.accounts.filter(a=>a.type==='Expense').reduce((s,a)=> s + accountNetDebit(a.code), 0);
  return rev - exp;
}
function nextDocNo(prefix){
  const n = state.nextEntryId++;
  return prefix + String(n).padStart(4,'0');
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function costCenterTotal(ccId){
  let total = 0;
  state.entries.forEach(e => e.lines.forEach(l => {
    if (l.costCenterId === ccId){ const acc = acctByCode(l.code); if (acc && acc.type==='Expense') total += (l.debit||0) - (l.credit||0); }
  }));
  state.internalOrders.forEach(o => {
    if (o.settledTo && o.settledTo.type==='costcenter' && o.settledTo.id===ccId){ total += internalOrderTotal(o.id); }
  });
  return total;
}
function internalOrderTotal(orderId){
  let total = 0;
  state.entries.forEach(e => e.lines.forEach(l => {
    if (l.internalOrderId === orderId){ const acc = acctByCode(l.code); if (acc && acc.type==='Expense') total += (l.debit||0) - (l.credit||0); }
  }));
  return total;
}
function internalOrderCostBreakdown(orderId){
  const map = {};
  state.entries.forEach(e => e.lines.forEach(l => {
    if (l.internalOrderId === orderId){
      const acc = acctByCode(l.code);
      if (acc && acc.type==='Expense'){
        const amt = (l.debit||0) - (l.credit||0);
        if (Math.abs(amt) > 0.001) map[l.code] = (map[l.code]||0) + amt;
      }
    }
  }));
  return map;
}
function profitCenterTotal(pcId, type){
  let total = 0;
  state.entries.forEach(e => e.lines.forEach(l => {
    if (l.profitCenterId === pcId){
      const acc = acctByCode(l.code);
      if (acc && acc.type===type){
        total += type==='Revenue' ? (l.credit||0)-(l.debit||0) : (l.debit||0)-(l.credit||0);
      }
    }
  }));
  return total;
}

}
function internalOrderOptions(selected){

}
function isReversed(entryId){ return state.entries.some(e => e.reversalOf === entryId); }

function exercisesDoneCount(){ return EXERCISES.filter((_,i) => state.exercisesDone[i]).length; }
function exercisesPct(){ return Math.round((exercisesDoneCount() / EXERCISES.length) * 100); }
function readinessScore(){
  const exPart = exercisesPct() * 0.6;
  const touches = [
    state.entries.some(e=>e.source==='GL'),
    state.entries.some(e=>e.source==='AP'),
    state.entries.some(e=>e.source==='AR'),
    state.assets.length > 0,
    state.entries.some(e=>e.lines && e.lines.some(l=>l.costCenterId)),
    state.entries.some(e=>e.source==='REV'),
    state.closingRuns.length > 0
  ].filter(Boolean).length;
  const breadthPart = (touches / 7) * 40;
  return Math.min(100, Math.round(exPart + breadthPart));
}
function readinessBand(score){
  if (score >= 85) return 'Industry-Ready';
  if (score >= 60) return 'Job-Ready Foundations';
  if (score >= 30) return 'Getting There';
  return 'Just Starting';
}
// Sanity-check only — a well-formed transaction ID, NOT proof of payment on its own.
function looksLikeRealTxnId(txn){
  if (!txn) return false;
  const cleaned = txn.replace(/\s+/g, '');
  if (cleaned.length < 10 || cleaned.length > 30) return false;
  if (!/^[A-Za-z0-9]+$/.test(cleaned)) return false;
  if (/^0+$/.test(cleaned) || /^(\d)\1+$/.test(cleaned)) return false;
  const lower = cleaned.toLowerCase();
  const fakeWords = ['test','fake','dummy','sample','xxxx','none','na','asdf','1234567890','123456789012'];
  for (let i=0;i<fakeWords.length;i++){ if (lower.indexOf(fakeWords[i]) !== -1) return false; }
  return true;
}
function checkTxnOnline(txn, name, email){
  if (!GAS_ENDPOINT || GAS_ENDPOINT.indexOf('PASTE_YOUR') === 0){
    return Promise.resolve({ status:'not_configured' });
  }
  const controller = ('AbortController' in window) ? new AbortController() : null;
  const timeoutId = controller ? setTimeout(() => controller.abort(), 9000) : null;
  const qs = '?txn=' + encodeURIComponent(txn) + '&name=' + encodeURIComponent(name||'') + '&email=' + encodeURIComponent(email||'');
  return fetch(GAS_ENDPOINT + qs, { method:'GET', signal: controller ? controller.signal : undefined })
    .then(res => { if (timeoutId) clearTimeout(timeoutId); return res.json(); })
    .catch(() => { if (timeoutId) clearTimeout(timeoutId); return { status:'network_error' }; });
}
async function reverseEntry(entryId){
  const orig = state.entries.find(e => e.id === entryId);
  if (!orig || isReversed(orig.id) || orig.source === 'REV') return;
  if (!confirm('Reverse document ' + orig.doc + '? This posts an equal and opposite entry — the original stays in the record.')) return;
  const revLines = orig.lines.map(l => ({ ...l, debit: l.credit, credit: l.debit }));
  state.entries.push({
    id: state.nextEntryId, doc: nextDocNo('RV-'), date: new Date().toISOString().slice(0,10),
    description: 'Reversal of ' + orig.doc + ' — ' + orig.description, source:'REV', reversalOf: orig.id, lines: revLines
  });
  await saveState();
  render();
}

function renderPractice(){
  const pct = exercisesPct();
  return `
  <div class="view-header">
    <div class="eyebrow">Guided Practice</div>
    <h1>Practice exercises</h1>
    <p>Work through these scenarios in order using the Postings tabs on the left. Toggle a hint if you get stuck — there's no auto-grading, so use the Trial Balance and Financial Statements to self-check. Tick each one off as you complete it — 100% unlocks your certificate.</p>
  </div>
  <div class="card">
    <div class="progress-label"><span>Progress</span><span>${exercisesDoneCount()} / ${EXERCISES.length} · ${pct}%</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="card">
    ${EXERCISES.map((ex,i) => `
      <div class="exercise">
        <div class="ex-check">
          <input type="checkbox" id="ex-check-${i}" ${state.exercisesDone[i]?'checked':''} onchange="toggleExerciseDone(${i}, this.checked)">
          <div>
            <h3 style="${state.exercisesDone[i]?'text-decoration:line-through;color:var(--muted-2);':''}">${ex.title}</h3>
            <p>${ex.body}</p>
            <button class="hint-toggle" onclick="toggleHint(${i})">Show hint ↓</button>
            <div class="hint-body" id="hint-${i}">${ex.hint}</div>
          </div>
        </div>
      </div>
    `).join('')}
  </div>
  `;
}
async function toggleExerciseDone(i, checked){
  state.exercisesDone[i] = checked;
  await saveState();
  render();
}
function toggleHint(i){
  document.getElementById('hint-'+i).classList.toggle('show');
}

  <div class="view-header">
    <div class="eyebrow">Reference</div>
    <h1>T-Code Concept Bridge</h1>
    <p>Every action in LedgerLab has a real transaction code (T-code) behind it, using SAP's naming as the industry-standard reference. Use this table to translate what you practised here into the vocabulary you'll need on a real SAP S/4HANA system or in an interview.</p>

function updateTape(kind){
  const lines = kind==='gl' ? glLines : [];
  const dr = lines.reduce((s,l)=>s+(parseFloat(l.debit)||0),0);

    const msg = document.getElementById('park-msg');

async function postParkedDoc(parkId){
  const p = state.parkedDocuments.find(x=>x.id===parkId);
  if (!p) return;
  const dr = p.lines.reduce((s,l)=>s+(l.debit||0),0);
  const cr = p.lines.reduce((s,l)=>s+(l.credit||0),0);
  if (Math.abs(dr-cr) > 0.005){ return; }
  state.entries.push({ id: state.nextEntryId, doc: nextDocNo('JE-'), date: p.date, description: p.description, source:'GL', lines: p.lines });
  state.parkedDocuments = state.parkedDocuments.filter(x=>x.id!==parkId);
  await saveState();
  render();
}
async function discardParkedDoc(parkId){
  if (!confirm('Discard this parked document? This cannot be undone.')) return;
  state.parkedDocuments = state.parkedDocuments.filter(x=>x.id!==parkId);
  await saveState();
  render();
}

    state.recurringTemplates.push({ id: state.nextRecurringId++, name, lines: cleaned, occurrencesTotal: occurrences, occurrencesDone: 0, active: true });
    await saveState();
    recurringLines = [ {code:'', debit:'', credit:'', costCenterId:''}, {code:'', debit:'', credit:'', costCenterId:''} ];
    recurringForm = { name:'', occurrences:'12' };
    render();
    const m2 = document.getElementById('rec-msg'); if (m2) m2.innerHTML = `<div class="msg success">Recurring template "${escapeHtml(name)}" saved.</div>`;
  }
});
async function runRecurringTemplate(templateId){
  const t = state.recurringTemplates.find(x=>x.id===templateId);
  if (!t || !t.active) return;
  state.entries.push({
    id: state.nextEntryId, doc: nextDocNo('RC-'), date: new Date().toISOString().slice(0,10),
    description: 'Recurring entry — ' + t.name, source:'REC', lines: t.lines.map(l=>({...l}))
  });
  t.occurrencesDone++;
  if (t.occurrencesDone >= t.occurrencesTotal) t.active = false;
  await saveState();
  render();
}
async function deleteRecurringTemplate(templateId){
  if (!confirm('Delete this recurring template? Entries already posted from it stay in the ledger.')) return;
  state.recurringTemplates = state.recurringTemplates.filter(x=>x.id!==templateId);
  await saveState();
  render();
}

function computePayroll(){
  const gross = parseFloat(document.getElementById('py-gross')?.value) || 0;
  const pfRate = parseFloat(document.getElementById('py-pf')?.value) || 0;
  const esiRate = parseFloat(document.getElementById('py-esi')?.value) || 0;
  const pt = parseFloat(document.getElementById('py-pt')?.value) || 0;
  const employerPf = document.getElementById('py-employer-pf')?.checked || false;
  const pfEmp = Math.round(gross * pfRate) / 100;
  const esiEmp = Math.round(gross * esiRate) / 100;
  const netPay = gross - pfEmp - esiEmp - pt;
  const pfEmployer = employerPf ? pfEmp : 0;
  return { gross, pfEmp, esiEmp, pt, netPay, pfEmployer };
}

  const el = document.getElementById('payroll-preview');

/* ==================== CASH FLOW STATEMENT (Direct Method) ==================== */
function cashFlowActivities(){
  let operating = 0, investing = 0, financing = 0;
  const rows = [];
  state.entries.forEach(e => {
    const cashLines = e.lines.filter(l => l.code==='1000' || l.code==='1010');
    if (!cashLines.length) return;
    const netCash = cashLines.reduce((s,l)=>s+(l.debit||0)-(l.credit||0), 0);
    if (Math.abs(netCash) < 0.001) return;
    const others = e.lines.filter(l => l.code!=='1000' && l.code!=='1010');
    const isInvesting = others.some(l => l.code==='1600');
    const isFinancing = others.some(l => l.code==='3000' || l.code==='2100');
    const bucket = isInvesting ? 'Investing' : (isFinancing ? 'Financing' : 'Operating');
    if (bucket==='Investing') investing += netCash;
    else if (bucket==='Financing') financing += netCash;
    else operating += netCash;
    rows.push({ doc:e.doc, date:e.date, desc:e.description, amount:netCash, bucket });
  });
  return { operating, investing, financing, net: operating+investing+financing, rows };
}

function openSettleForm(orderId){

function toggleSettleAssetFields(orderId){
  const target = document.getElementById('settle-target-'+orderId).value;
  const methodEl = document.getElementById('settle-asset-method-'+orderId);
  const method = methodEl ? methodEl.value : 'SLM';
  document.getElementById('settle-cc-wrap-'+orderId).style.display = target==='costcenter' ? 'flex' : 'none';
  document.getElementById('settle-asset-name-wrap-'+orderId).style.display = target==='asset' ? 'flex' : 'none';

  document.getElementById('settle-asset-rate-wrap-'+orderId).style.display = (target==='asset' && method==='WDV') ? 'flex' : 'none';

async function settleInternalOrder(orderId){
  const o = state.internalOrders.find(x=>x.id===orderId);
  if (!o) return;
  const msg = document.getElementById('settle-msg-'+orderId);
  const target = document.getElementById('settle-target-'+orderId).value;
  const actual = internalOrderTotal(orderId);
  if (actual <= 0){ msg.innerHTML = `<div class="msg error">This order has no costs collected yet — nothing to settle.</div>`; return; }
  if (target === 'costcenter'){
    const ccId = parseInt(document.getElementById('settle-cc-'+orderId).value);
    if (!ccId){ msg.innerHTML = `<div class="msg error">Choose a cost center.</div>`; return; }
    const cc = state.costCenters.find(c=>c.id===ccId);
    o.status = 'settled';
    o.settledTo = { type:'costcenter', id: ccId, name: cc.name };
    await saveState();
    render();
  } else {
    const assetName = document.getElementById('settle-asset-name-'+orderId).value.trim();
    const method = document.getElementById('settle-asset-method-'+orderId).value;
    const life = method==='SLM' ? (parseInt(document.getElementById('settle-asset-life-'+orderId).value) || 5) : 0;
    const rate = method==='WDV' ? (parseFloat(document.getElementById('settle-asset-rate-'+orderId).value) || 15) : Math.round((100/(life||5))*10)/10;
    if (!assetName){ msg.innerHTML = `<div class="msg error">Give the new asset a name.</div>`; return; }
    const breakdown = internalOrderCostBreakdown(orderId);
    const codes = Object.keys(breakdown);
    if (codes.length === 0){ msg.innerHTML = `<div class="msg error">No expense postings found on this order.</div>`; return; }
    const lines = [ { code:'1600', debit: actual, credit:0 } ];
    codes.forEach(code => { lines.push({ code, debit:0, credit: breakdown[code] }); });
    const date = new Date().toISOString().slice(0,10);
    state.entries.push({ id: state.nextEntryId, doc: nextDocNo('SETL-'), date, description: 'Settlement — ' + o.name + ' → ' + assetName, source:'GL', lines });
    const assetId = state.nextAssetId++;
    state.assets.push({ id: assetId, name: assetName, cost: actual, life: life||5, rate, method, depreciationRuns: 0, accumulatedDepreciation: 0, disposed:false });
    o.status = 'settled';
    o.settledTo = { type:'asset', assetId, name: assetName };
    await saveState();
    render();
  }
}

    return `<tr>

/* ==================== AP/AR AGEING ==================== */
function daysBetween(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}
function ageBucket(days){
  if (days <= 30) return '0–30 days';
  if (days <= 60) return '31–60 days';
  if (days <= 90) return '61–90 days';
  return '90+ days';
}
function oldestOpenDate(entries, source, matchField){
  const invoices = entries.filter(e => e.source===source && e.lines.some(l => l[matchField] !== undefined && (source==='AP' ? l.credit>0 : l.debit>0)));
  if (!invoices.length) return null;
  return invoices.map(e=>e.date).sort()[0];
}
function ageingRows(list, balanceFn, source, matchField){
  return list.map(item => {
    const bal = balanceFn(item.id);
    if (Math.abs(bal) < 0.01) return null;
    const oldest = oldestOpenDate(state.entries, source, matchField);
    const days = oldest ? daysBetween(oldest) : 0;
    const bucket = ageBucket(days);
    return { name: item.name, bal, days, bucket };
  }).filter(Boolean);
}
function renderAgeing(){
  const apRows = state.vendors.map(v => {
    const bal = accountVendorBalance(v.id);
    if (Math.abs(bal) < 0.01) return null;
    const invoices = state.entries.filter(e => e.source==='AP' && e.lines.some(l => l.vendorId===v.id && l.credit>0));
    const oldest = invoices.length ? invoices.map(e=>e.date).sort()[0] : null;
    const days = oldest ? daysBetween(oldest) : 0;
    return { name: v.name, bal, days, bucket: ageBucket(days) };
  }).filter(Boolean);
  const arRows = state.customers.map(c => {
    const bal = customerBalance(c.id);
    if (Math.abs(bal) < 0.01) return null;
    const invoices = state.entries.filter(e => e.source==='AR' && e.lines.some(l => l.customerId===c.id && l.debit>0));
    const oldest = invoices.length ? invoices.map(e=>e.date).sort()[0] : null;
    const days = oldest ? daysBetween(oldest) : 0;
    return { name: c.name, bal, days, bucket: ageBucket(days) };
  }).filter(Boolean);
  function bucketSummary(rows){
    const buckets = { '0–30 days':0, '31–60 days':0, '61–90 days':0, '90+ days':0 };
    rows.forEach(r => buckets[r.bucket] += r.bal);
    return buckets;
  }
  const apBuckets = bucketSummary(apRows), arBuckets = bucketSummary(arRows);
  const bucketRow = (buckets) => Object.entries(buckets).map(([k,v]) => `<tr><td class="name">${k}</td><td class="num">₹ ${fmt(v)}</td></tr>`).join('');
  return `
  <div class="view-header">
    <div class="eyebrow">Reporting · FBL1N (vendors) / FBL5N (customers)</div>
    <h1>AP/AR Ageing</h1>
    <p>How long has each outstanding balance been open, counted from its oldest unpaid invoice? Buckets follow the standard 0–30 / 31–60 / 61–90 / 90+ day convention used in real ageing reports. This is a simplified single-bucket-per-party view — a real system ages every individual open invoice line separately.</p>
  </div>
  <div class="two-col">
    <div class="card">
      <h2>Accounts Payable Ageing</h2>
      <div class="paper">
        <table>
          <thead><tr><th>Vendor</th><th class="num">Owed</th><th>Age</th></tr></thead>
          <tbody>${apRows.map(r=>`<tr><td class="name">${escapeHtml(r.name)}</td><td class="num">₹ ${fmt(r.bal)}</td><td>${r.bucket}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="3">Nothing outstanding.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="paper" style="margin-top:12px;">
        <table><thead><tr><th>Bucket</th><th class="num">Total</th></tr></thead><tbody>${bucketRow(apBuckets)}</tbody></table>
      </div>
    </div>
    <div class="card">
      <h2>Accounts Receivable Ageing</h2>
      <div class="paper">
        <table>
          <thead><tr><th>Customer</th><th class="num">Owes</th><th>Age</th></tr></thead>
          <tbody>${arRows.map(r=>`<tr><td class="name">${escapeHtml(r.name)}</td><td class="num">₹ ${fmt(r.bal)}</td><td>${r.bucket}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="3">Nothing outstanding.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="paper" style="margin-top:12px;">
        <table><thead><tr><th>Bucket</th><th class="num">Total</th></tr></thead><tbody>${bucketRow(arBuckets)}</tbody></table>
      </div>
    </div>
  </div>
  `;
}

    <table>
      <thead><tr><th>Run Date</th><th class="num">Vendors Paid</th><th class="num">Total Paid</th></tr></thead>

async function executePaymentRun(){
  const msg = document.getElementById('pr-msg');
  const bankCode = document.getElementById('pr-bank').value;
  const tdsRate = parseFloat(document.getElementById('pr-tds').value) || 0;
  const vendorsOwed = state.vendors.map(v=>({ v, owed: accountVendorBalance(v.id) })).filter(x=>x.owed>0.01);
  const selected = vendorsOwed.filter(x => paymentRunForm.selected[x.v.id] !== false);
  if (selected.length === 0){ if(msg) msg.innerHTML = `<div class="msg error">Select at least one vendor to pay.</div>`; return; }
  const date = new Date().toISOString().slice(0,10);
  const runId = state.nextPaymentRunId++;
  let total = 0;
  selected.forEach(({ v, owed }) => {
    const tds = Math.round(owed * tdsRate) / 100;
    const net = owed - tds;
    const lines = [ { code:'2000', debit: owed, credit:0, vendorId: v.id }, { code: bankCode, debit:0, credit: net } ];
    if (tds > 0) lines.push({ code:'2200', debit:0, credit: tds });
    state.entries.push({
      id: state.nextEntryId, doc: nextDocNo('PR-'), date, description: 'Payment run — ' + v.name, source:'AP', paymentRunId: runId,
      lines, tds: tds>0 ? { rate: tdsRate, amount: tds, gross: owed, net, vendorName: v.name } : undefined
    });
    total += net;
  });
  state.paymentRuns.push({ id: runId, date, count: selected.length, total });
  await saveState();
  render();
  const m2 = document.getElementById('pr-msg'); if (m2) m2.innerHTML = `<div class="msg success">Payment run executed — ${selected.length} vendor(s) paid, ₹${fmt(total)} total.</div>`;
}

/* ==================== DUNNING RUN (F150) ==================== */
function dunningLevel(days){
  if (days >= 91) return { level:4, label:'Final Demand / Legal Notice' };
  if (days >= 61) return { level:3, label:'Second Dunning Notice' };
  if (days >= 31) return { level:2, label:'First Dunning Notice' };
  if (days >= 15) return { level:1, label:'Payment Reminder' };
  return { level:0, label:'Current — no dunning due' };
}
function dunningCandidates(){
  return state.customers.map(c => {
    const bal = customerBalance(c.id);
    if (bal < 0.01) return null;
    const invoices = state.entries.filter(e => e.source==='AR' && e.lines.some(l => l.customerId===c.id && l.debit>0));
    const oldest = invoices.length ? invoices.map(e=>e.date).sort()[0] : null;
    const days = oldest ? daysBetween(oldest) : 0;
    return { id:c.id, name:c.name, bal, days, oldest, ...dunningLevel(days) };
  }).filter(Boolean);
}
function renderDunning(){
  const candidates = dunningCandidates();
  const history = state.dunningRuns.slice().reverse().map(r => `
    <tr><td>${r.date}</td><td class="num">${r.letters.length}</td>
      <td>${r.letters.map(l=>`${escapeHtml(l.name)} (Lvl ${l.level})`).join(', ') || '—'}</td></tr>
  `).join('');
  return `
  <div class="view-header">
    <div class="eyebrow">Reporting · F150</div>
    <h1>Dunning Run</h1>
    <p>Runs across every customer with an open balance and assigns a dunning level based on how overdue their oldest invoice is — from a gentle reminder up to a final demand. This is a memo/notice process: it does not post any accounting entries by itself.</p>
  </div>
  <div class="card">
    <h2>Dunning proposal</h2>
    <div class="paper">
      <table>
        <thead><tr><th>Customer</th><th class="num">Open Balance</th><th>Days Overdue</th><th>Dunning Level</th><th></th></tr></thead>
        <tbody>
          ${candidates.map(c => `
            <tr>
              <td class="name">${escapeHtml(c.name)}</td>
              <td class="num">₹ ${fmt(c.bal)}</td>
              <td>${c.days}</td>
              <td><span class="badge ${c.level>=3?'liability':(c.level>=1?'expense':'asset')}">Level ${c.level} — ${c.label}</span></td>
              <td>${c.level>0 ? `<button class="btn ghost small" onclick="viewDunningLetter(${c.id})">View letter</button>` : ''}</td>
            </tr>
          `).join('') || '<tr class="empty-row"><td colspan="5">No customers have an open balance.</td></tr>'}
        </tbody>
      </table>
    </div>
    <button class="btn secondary" style="margin-top:14px;" onclick="runDunning()" ${candidates.filter(c=>c.level>0).length===0?'disabled':''}>Run dunning (log this proposal)</button>
    <div id="dunning-msg" style="margin-top:12px;"></div>
  </div>
  <div class="paper" style="margin-top:18px;">
    <table>
      <thead><tr><th>Run Date</th><th class="num">Letters</th><th>Customers</th></tr></thead>
      <tbody>${history || '<tr class="empty-row"><td colspan="3">No dunning runs logged yet.</td></tr>'}</tbody>
    </table>
  </div>
  `;
}
async function runDunning(){
  const candidates = dunningCandidates().filter(c=>c.level>0);
  if (candidates.length === 0){ const m=document.getElementById('dunning-msg'); if(m) m.innerHTML = `<div class="msg error">No customer currently qualifies for dunning.</div>`; return; }
  state.dunningRuns.push({ id: state.nextDunningRunId++, date: new Date().toISOString().slice(0,10), letters: candidates });
  await saveState();
  render();
  const m2 = document.getElementById('dunning-msg'); if (m2) m2.innerHTML = `<div class="msg success">Dunning run logged — ${candidates.length} letter(s) proposed.</div>`;
}
function viewDunningLetter(customerId){
  const c = state.customers.find(x=>x.id===customerId);
  if (!c) return;
  const bal = customerBalance(customerId);
  const cand = dunningCandidates().find(x=>x.id===customerId);
  const days = cand ? cand.days : 0;
  const oldest = cand ? cand.oldest : null;
  const dl = dunningLevel(days);
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write(`
    <html><head><title>Dunning Notice — ${escapeHtml(c.name)}</title>
    <style>body{font-family:Georgia,serif; max-width:640px; margin:40px auto; line-height:1.6; color:#222;}
    h1{font-size:20px;} .lvl{color:#a33; font-weight:bold;}</style></head>
    <body>
    <h1>Dunning Notice — Level ${dl.level}: ${dl.label}</h1>
    <p>Date: ${new Date().toISOString().slice(0,10)}</p>
    <p>To: ${escapeHtml(c.name)}</p>
    <p>Dear ${escapeHtml(c.name)},</p>
    <p>Our records show an outstanding balance of <strong>₹ ${fmt(bal)}</strong> on your account, overdue by <span class="lvl">${days} days</span>
    (oldest open invoice dated ${oldest||'—'}).</p>
    <p>${dl.level>=3 ? 'This is a final notice. Please settle this balance immediately to avoid further action, including possible legal recovery.' :
        dl.level===2 ? 'This is a second reminder. Please arrange payment at your earliest convenience.' :
        'This is a friendly reminder that your payment is now overdue. Please arrange settlement soon.'}</p>
    <p>Thank you for your prompt attention to this matter.</p>
    </body></html>
  `);
  w.document.close();
}

document.addEventListener('submit', async (e) => {
  if (e.target && e.target.id === 'fx-form'){
    e.preventDefault();
    const msg = document.getElementById('fx-msg');
    const type = document.getElementById('fx-type').value;
    const partyId = parseInt(document.getElementById('fx-party').value);
    const currency = document.getElementById('fx-currency').value;
    const fcAmount = parseFloat(document.getElementById('fx-amount').value) || 0;
    const oldRate = parseFloat(document.getElementById('fx-rate-old').value) || 0;
    const newRate = parseFloat(document.getElementById('fx-rate-new').value) || 0;
    const date = document.getElementById('fx-date').value;
    if (!partyId){ msg.innerHTML = `<div class="msg error">Choose a vendor or customer.</div>`; return; }
    if (fcAmount <= 0 || oldRate <= 0 || newRate <= 0){ msg.innerHTML = `<div class="msg error">Enter a foreign currency amount and both exchange rates.</div>`; return; }
    const diffINR = Math.round((fcAmount * newRate - fcAmount * oldRate) * 100) / 100;
    if (Math.abs(diffINR) < 0.01){ msg.innerHTML = `<div class="msg error">Rates are identical — there's no exchange difference to post.</div>`; return; }
    let partyName, lines;
    if (type === 'vendor'){
      const v = state.vendors.find(x=>x.id===partyId);
      if (!v){ msg.innerHTML = `<div class="msg error">Vendor not found.</div>`; return; }
      partyName = v.name;
      // Liability increases with a higher closing rate → loss; decreases → gain
      if (diffINR > 0) lines = [ { code:'5250', debit: diffINR, credit:0 }, { code:'2000', debit:0, credit: diffINR, vendorId: partyId } ];
      else lines = [ { code:'2000', debit: -diffINR, credit:0, vendorId: partyId }, { code:'4250', debit:0, credit: -diffINR } ];
    } else {
      const c = state.customers.find(x=>x.id===partyId);
      if (!c){ msg.innerHTML = `<div class="msg error">Customer not found.</div>`; return; }
      partyName = c.name;
      // Receivable increases with a higher closing rate → gain; decreases → loss
      if (diffINR > 0) lines = [ { code:'1200', debit: diffINR, credit:0, customerId: partyId }, { code:'4250', debit:0, credit: diffINR } ];
      else lines = [ { code:'5250', debit: -diffINR, credit:0 }, { code:'1200', debit:0, credit: -diffINR, customerId: partyId } ];
    }
    state.entries.push({
      id: state.nextEntryId, doc: nextDocNo('FX-'), date, description: 'FX revaluation — ' + partyName, source:'GL', lines
    });
    const gainLoss = type==='vendor' ? -diffINR : diffINR;
    state.fxRevaluations.push({ id: state.nextFxRevalId++, date, partyType: type==='vendor'?'Vendor':'Customer', partyName, currency, fcAmount, oldRate, newRate, gainLoss });
    await saveState();
    render();
    const m2 = document.getElementById('fx-msg'); if (m2) m2.innerHTML = `<div class="msg success">Revaluation posted for ${escapeHtml(partyName)} — ₹${fmt(Math.abs(gainLoss))} exchange ${gainLoss>=0?'gain':'loss'}.</div>`;
  }
});

  return `

let assetForm = { name:'', cost:'', life:'5', rate:'15', method:'SLM', fundedBy:'1010', date:'' };
function assetNBV(a){ return Math.max(0, a.cost - (a.accumulatedDepreciation||0)); }
function computeMonthlyDep(a){
  const nbv = assetNBV(a);
  if (nbv <= 0) return 0;
  let dep;
  if (a.method === 'WDV'){ dep = (nbv * (a.rate/100)) / 12; }
  else { dep = a.cost / a.life / 12; }
  return Math.min(Math.round(dep*100)/100, nbv);
}
function renderAssets(){
  const activeAssets = state.assets.filter(a=>!a.disposed);
  const disposedAssets = state.assets.filter(a=>a.disposed);

    const nbv = assetNBV(a);
    return `<tr><td class="name">${escapeHtml(a.name)}</td><td>${a.method==='WDV'?'WDV '+a.rate+'%':'SLM '+a.life+'y'}</td><td class="num">₹ ${fmt(a.cost)}</td>
      <td class="num">₹ ${fmt(accDep)}</td><td class="num">₹ ${fmt(nbv)}</td>

      <td class="num" style="color:${a.disposalGain>=0?'var(--emerald)':'var(--rose)'};">${a.disposalGain>=0?'Gain':'Loss'} ₹${fmt(Math.abs(a.disposalGain))}</td><td></td></tr>
  `).join('');
  const methodIsWdv = assetForm.method === 'WDV';
  return `

    <p>Capitalise a fixed asset with either Straight Line (SLM) or Written Down Value (WDV, reducing balance) depreciation, run monthly depreciation, and dispose of assets when sold — recognising any gain or loss against Net Book Value.</p>
  </div>
  ${state.periodClosed ? `<div class="msg error">The current period is closed. Open Period-End Close to start a new period before posting.</div>` : `
  <div class="two-col">
    <div class="card">
      <h2>Capitalise a new asset (AS01)</h2>

      <form id="asset-form">

          <div class="field full"><label>Asset Name</label><input type="text" id="asset-name" placeholder="e.g. Delivery Van"></div>

          <div class="field"><label>Depreciation Method</label>
            <select id="asset-method" onchange="assetForm.method=this.value; render();">
              <option value="SLM" ${!methodIsWdv?'selected':''}>Straight Line (SLM)</option>
              <option value="WDV" ${methodIsWdv?'selected':''}>Written Down Value (WDV)</option>
            </select>
          </div>
          ${methodIsWdv
            ? `<div class="field full"><label>Depreciation Rate (% per annum, on reducing balance)</label><input type="number" step="0.5" min="0" id="asset-rate" value="${assetForm.rate}" placeholder="15"></div>`
            : `<div class="field full"><label>Useful Life (years)</label><input type="number" step="1" min="1" id="asset-life" value="${assetForm.life}"></div>`}
          <div class="field full"><label>Funded By</label>
            <select id="asset-funded">
              <option value="1010">1010 · Bank Account (cash purchase)</option>
              <option value="2000">2000 · Accounts Payable (on credit)</option>

        </div>
        <button type="submit" class="btn">Capitalise asset</button>

function openDisposeFor(assetId){
  const a = state.assets.find(x=>x.id===assetId);
  if (!a) return;
  const card = document.getElementById('dispose-card');
  card.style.display = 'block';
  document.getElementById('dispose-asset-id').value = assetId;
  document.getElementById('dispose-asset-label').textContent = `${a.name} — cost ₹${fmt(a.cost)}, current NBV ₹${fmt(assetNBV(a))}`;
  if (card.scrollIntoView) card.scrollIntoView({ behavior:'smooth', block:'center' });
}
document.addEventListener('submit', async (e) => {
  if (e.target && e.target.id === 'asset-form'){
    e.preventDefault();
    const msg = document.getElementById('asset-msg');
    const name = document.getElementById('asset-name').value.trim();
    const cost = parseFloat(document.getElementById('asset-cost').value) || 0;
    const method = document.getElementById('asset-method').value;
    const lifeEl = document.getElementById('asset-life');
    const rateEl = document.getElementById('asset-rate');
    const life = lifeEl ? (parseInt(lifeEl.value) || 5) : 5;
    const rate = rateEl ? (parseFloat(rateEl.value) || 15) : 15;
    const fundedBy = document.getElementById('asset-funded').value;
    const date = document.getElementById('asset-date').value;
    if (!name || cost <= 0){ msg.innerHTML = `<div class="msg error">Enter a name and a cost greater than zero.</div>`; return; }
    const assetId = state.nextAssetId++;
    state.assets.push({ id: assetId, name, cost, life, rate, method, depreciationRuns: 0, accumulatedDepreciation: 0, disposed:false });
    state.entries.push({
      id: state.nextEntryId, doc: nextDocNo('AS-'), date, description: 'Asset capitalised — ' + name, source:'GL',
      lines: [ { code:'1600', debit: cost, credit:0 }, { code: fundedBy, debit:0, credit: cost } ]
    });
    await saveState();
    assetForm = { name:'', cost:'', life:'5', rate:'15', method:'SLM', fundedBy:'1010', date:'' };
    render();
    const m2 = document.getElementById('asset-msg'); if (m2) m2.innerHTML = `<div class="msg success">${escapeHtml(name)} capitalised at ₹${fmt(cost)} (${method}).</div>`;
  }
  if (e.target && e.target.id === 'dispose-form'){
    e.preventDefault();
    const msg = document.getElementById('dispose-msg');
    const assetId = parseInt(document.getElementById('dispose-asset-id').value);
    const proceeds = parseFloat(document.getElementById('dispose-proceeds').value) || 0;
    const bankCode = document.getElementById('dispose-bank').value;
    const date = document.getElementById('dispose-date').value;
    const a = state.assets.find(x=>x.id===assetId);
    if (!a){ msg.innerHTML = `<div class="msg error">Asset not found.</div>`; return; }
    if (proceeds < 0){ msg.innerHTML = `<div class="msg error">Enter a valid sale amount (0 or more).</div>`; return; }
    const accDep = a.accumulatedDepreciation || 0;
    const nbv = assetNBV(a);
    const gainLoss = proceeds - nbv;
    const lines = [
      { code: bankCode, debit: proceeds, credit: 0 },
      { code:'1650', debit: accDep, credit: 0 },
      { code:'1600', debit: 0, credit: a.cost }
    ];
    if (gainLoss > 0.001) lines.push({ code:'4300', debit:0, credit: gainLoss });
    else if (gainLoss < -0.001) lines.push({ code:'5600', debit: -gainLoss, credit:0 });
    state.entries.push({
      id: state.nextEntryId, doc: nextDocNo('DIS-'), date, description: 'Disposal of ' + a.name, source:'GL', lines
    });
    a.disposed = true;
    a.disposalDate = date;
    a.disposalGain = gainLoss;
    await saveState();
    render();
    const m2 = document.getElementById('asset-msg'); if (m2) m2.innerHTML = `<div class="msg success">${escapeHtml(a.name)} disposed — ${gainLoss>=0?'gain':'loss'} of ₹${fmt(Math.abs(gainLoss))} recognised.</div>`;
  }
});
async function runDepreciation(){
  const activeAssets = state.assets.filter(a=>!a.disposed);
  if (activeAssets.length === 0){ return; }
  let totalDep = 0;
  activeAssets.forEach(a => {
    const dep = computeMonthlyDep(a);
    totalDep += dep;
    a.accumulatedDepreciation = (a.accumulatedDepreciation || 0) + dep;
    a.depreciationRuns = (a.depreciationRuns || 0) + 1;
  });
  if (totalDep > 0){
    state.entries.push({
      id: state.nextEntryId, doc: nextDocNo('DEP-'), date: new Date().toISOString().slice(0,10),
      description: 'Monthly depreciation run — ' + activeAssets.length + ' asset(s)', source:'GL',
      lines: [ { code:'5400', debit: totalDep, credit:0 }, { code:'1650', debit:0, credit: totalDep } ]
    });
  }
  await saveState();
  render();
  const m2 = document.getElementById('dep-msg'); if (m2) m2.innerHTML = `<div class="msg success">Depreciation of ₹${fmt(totalDep)} posted across ${activeAssets.length} asset(s).</div>`;
}

function renderClosing(){
  const ni = netIncome();
  const history = state.closingRuns.slice().reverse().map(r => `
    <tr><td>${r.date}</td><td class="name">${escapeHtml(r.period)}</td><td class="num">₹ ${fmt(r.netIncome)}</td></tr>
  `).join('');
  return `
  <div class="view-header">
    <div class="eyebrow">Period Close · F.01</div>
    <h1>Period-End Closing</h1>
    <p>At period end, every Revenue and Expense account is zeroed out and its balance is transferred into Retained Earnings — so next period's P&amp;L starts fresh, and the year's profit is locked into equity on the Balance Sheet.</p>
  </div>
  <div class="tape">
    <div class="tape-seg"><div class="t-label">Current Period</div><div class="t-value" style="font-size:16px;">${state.period}</div></div>
    <div class="tape-seg"><div class="t-label">Net Income to Transfer</div><div class="t-value">₹ ${fmt(ni)}</div></div>
    <div class="tape-seg status"><div class="t-label">Status</div><div class="t-value ${state.periodClosed?'unbalanced':'balanced'}">${state.periodClosed?'Closed':'Open'}</div></div>
  </div>
  <div class="card">
    ${state.periodClosed ? `
      <h2>Start next period</h2>
      <p class="hint">This period is closed. Starting the next period reopens posting with a fresh P&amp;L; the Balance Sheet carries forward.</p>
      <button class="btn" onclick="startNextPeriod()">Start next period</button>
    ` : `
      <h2>Run closing entries</h2>
      <p class="hint">This posts one closing journal entry: debits every Revenue account down to zero, credits every Expense account down to zero, and moves the net ₹${fmt(ni)} into Retained Earnings (3900). This mirrors SAP's balance carry-forward (FAGLGVTR) at a simplified level.</p>
      <button class="btn" onclick="runClosingEntries()" ${ni===0 && state.entries.length===0 ? 'disabled':''}>Run closing entries</button>
    `}
    <div id="closing-msg" style="margin-top:12px;"></div>
  </div>
  <div class="paper">
    <table>
      <thead><tr><th>Closed On</th><th>Period</th><th class="num">Net Income Transferred</th></tr></thead>
      <tbody>${history || '<tr class="empty-row"><td colspan="3">No periods closed yet.</td></tr>'}</tbody>
    </table>
  </div>
  `;
}
async function runClosingEntries(){
  const revAccts = state.accounts.filter(a=>a.type==='Revenue');
  const expAccts = state.accounts.filter(a=>a.type==='Expense');
  const lines = [];
  revAccts.forEach(a => { const bal = -accountNetDebit(a.code); if (Math.abs(bal) > 0.001) lines.push({ code:a.code, debit: bal, credit:0 }); });
  expAccts.forEach(a => { const bal = accountNetDebit(a.code); if (Math.abs(bal) > 0.001) lines.push({ code:a.code, debit:0, credit: bal }); });
  const ni = netIncome();
  if (Math.abs(ni) > 0.001) lines.push({ code:'3900', debit: ni<0?-ni:0, credit: ni>0?ni:0 });
  if (lines.length > 0){
    state.entries.push({
      id: state.nextEntryId, doc: nextDocNo('CLS-'), date: new Date().toISOString().slice(0,10),
      description: 'Period-end closing entry — ' + state.period, source:'GL', lines
    });
  }
  state.closingRuns.push({ date: new Date().toISOString().slice(0,10), period: state.period, netIncome: ni });
  state.periodClosed = true;
  await saveState();
  render();
  const m2 = document.getElementById('closing-msg'); if (m2) m2.innerHTML = `<div class="msg success">Period closed. ₹${fmt(ni)} transferred to Retained Earnings.</div>`;
}
async function startNextPeriod(){
  const [y,m] = state.period.match(/(\d{4})-(\d{2})/).slice(1).map(Number);
  let ny = y, nm = m + 1;
  if (nm > 12){ nm = 1; ny += 1; }
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  state.period = `${ny}-${String(nm).padStart(2,'0')} (${monthNames[nm-1]} ${ny})`;
  state.periodClosed = false;
  await saveState();
  render();
}

const GAS_SETUP_SCRIPT = `// 1. Create a Google Sheet with columns:
//    TxnID | Status | Name | Email | ConfirmedAt | Timestamp
//    Status starts as "Pending" when a student submits a transaction ID.
//    YOU must open the Sheet, check the payment actually landed in your
//    UPI account, and only then change that row's Status to "Verified" —
//    this is the one manual confirmation step that gates the unlock.
//    ConfirmedAt fills in automatically the moment you do that. Status
//    flips to "Used" automatically the first time it successfully
//    unlocks a device, so a transaction ID can never unlock twice.
// 2. Extensions -> Apps Script in that Sheet, paste this in, then
//    Deploy -> New deployment -> Web app (Execute as: Me, Access: Anyone).
// 3. Copy the deployment URL into GAS_ENDPOINT near the top of this file.

function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sheet1');
  var txn = (e.parameter.txn || '').trim();
  var name = (e.parameter.name || '').trim();
  var email = (e.parameter.email || '').trim();
  if (!txn) return respond({status:'rejected'});

  var data = sheet.getDataRange().getValues();
  for (var i = 1; i < data.length; i++) {
    if (String(data[i][0]).trim() === txn) {
      var status = String(data[i][1]).trim();
      if (status === 'Verified') {
        var confirmedAt = data[i][4];
        sheet.getRange(i+1, 2).setValue('Used');
        return respond({status:'ok', confirmedAt: confirmedAt ? new Date(confirmedAt).toISOString() : null});
      }
      if (status === 'Used') return respond({status:'duplicate'});
      return respond({status:'pending'});
    }
  }
  // First time we've seen this transaction ID — log it as Pending.
  // ConfirmedAt (column E) is intentionally left blank until a human checks it.
  sheet.appendRow([txn, 'Pending', name, email, '', new Date()]);
  return respond({status:'pending'});
}

// Optional: run this trigger (Triggers -> onFormSubmitOrEdit) so ConfirmedAt
// auto-stamps the moment you type "Verified" into column B by hand.
function onEdit(e) {
  var sheet = e.source.getActiveSheet();
  if (sheet.getName() !== 'Sheet1') return;
  if (e.range.getColumn() !== 2) return; // only react to edits in the Status column
  if (String(e.range.getValue()).trim() === 'Verified') {
    sheet.getRange(e.range.getRow(), 5).setValue(new Date()); // stamp ConfirmedAt
  }
}
function respond(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`;

        <div class="field full"><label>UPI transaction ID / UTR (from your payment app, after paying)</label><input type="text" id="payTxn" value="${escapeHtml(pending?pending.txn:'')}" placeholder="e.g. 409223456789" maxlength="30" autocomplete="off"></div>
      </div>
      <p style="font-size:11px; color:var(--muted-2); margin:-6px 0 12px;">Copy this from the payment success screen or your bank SMS/app history — usually 10–22 letters/numbers. Each real transaction ID can only unlock once, ever. Unlocking always requires one manual confirmation step recorded in the verification sheet — see below.</p>
      <button class="btn" id="payUnlockBtn" onclick="handlePayUnlock()">${pending ? 'Re-check Verification Status' : 'I Have Paid — Submit for Verification'}</button>
      ${pending ? `<p style="font-size:11px; color:var(--muted-2); margin-top:8px;">Submitted ${new Date(pending.submittedAt).toLocaleString('en-IN')}${pending.lastCheckedAt ? ' · last checked ' + new Date(pending.lastCheckedAt).toLocaleString('en-IN') : ''}.</p>` : ''}
      <div class="pay-status" id="payTxnStatus"></div>
    `}
  </div>
  <div class="card">
    <details class="setup" ${configured?'':'open'}>
      <summary>${configured ? 'Verification is configured ✓ — view the Apps Script setup guide' : 'Not yet configured — set up real, human-confirmed verification:'}</summary>
      <p class="hint" style="margin-bottom:10px;">This lab checks transaction IDs against a free Google Sheet "backend" via Google Apps Script — no paid infrastructure needed. Unlocking always requires <strong>one explicit human confirmation step</strong>: a transaction ID is logged as "Pending" the first time it's submitted, and only unlocks once you personally check the payment landed and flip that row's Status to "Verified" in the Sheet. Until <code>GAS_ENDPOINT</code> is filled in near the top of this file, the lab runs in demo mode (instant unlock, clearly labelled as such) so it's still fully usable out of the box.</p>
      <div class="setup-guide">${escapeHtml(GAS_SETUP_SCRIPT)}</div>
    </details>
  </div>
  `;
}
async function handlePayUnlock(){
  const nameEl = document.getElementById('payName');
  const emailEl = document.getElementById('payEmail');
  const txnEl = document.getElementById('payTxn');
  const btn = document.getElementById('payUnlockBtn');
  const name = nameEl.value.trim();
  const email = emailEl ? emailEl.value.trim() : '';
  const txn = txnEl.value.trim();
  function setStatus(text, cls){
    const el = document.getElementById('payTxnStatus');
    if (el){ el.className = 'pay-status' + (cls ? ' '+cls : ''); el.textContent = text || ''; }
  }
  if (!name){ alert('Please enter your full name.'); nameEl.focus(); return; }
  if (!looksLikeRealTxnId(txn)){
    alert("That doesn't look like a real UPI transaction ID / UTR. Pay first, then copy the exact transaction ID shown on your payment app's success screen (usually 10–22 letters/numbers) — not a placeholder value.");
    txnEl.focus();
    return;
  }
  const origLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Checking…';
  setStatus('Checking…', 'pending');
  const result = await checkTxnOnline(txn, name, email);
  const now = new Date().toISOString();
  if (result.status === 'ok'){
    state.premiumUnlocked = true;
    state.studentName = name;
    state.premiumConfirmedAt = result.confirmedAt || now;
    state.pendingPayment = null;
    await saveState();
    render();
  } else if (result.status === 'not_configured'){
    state.premiumUnlocked = true;
    state.studentName = name;
    state.premiumConfirmedAt = null; // demo mode — no real confirmation happened
    state.pendingPayment = null;
    await saveState();
    render();
  } else if (result.status === 'pending'){
    state.pendingPayment = { txn, name, email, submittedAt: (state.pendingPayment && state.pendingPayment.txn===txn) ? state.pendingPayment.submittedAt : now, lastCheckedAt: now };
    state.studentName = name;
    await saveState();
    setStatus('⏳ Logged in the verification sheet as "Pending" — this unlocks only after the payment is manually confirmed there. Check back shortly and click "Re-check Verification Status".', 'pending');
    render();
  } else if (result.status === 'rejected'){
    setStatus("This transaction ID couldn't be matched to a payment. Double-check it, or message Dr. Debasis Pahi on LinkedIn if you believe this is a mistake.", 'err');
    btn.disabled = false; btn.textContent = origLabel;
  } else if (result.status === 'duplicate'){
    setStatus('This transaction ID has already been used to unlock Premium — each payment can only unlock once, on one device.', 'err');
    btn.disabled = false; btn.textContent = origLabel;
  } else {
    setStatus('Could not reach the verification log (no internet, or the check timed out). Please try again.', 'err');
    btn.disabled = false; btn.textContent = origLabel;
  }
}

function makeCertNo(){
  const d = new Date();
  const rand = Math.random().toString(36).slice(2,7).toUpperCase();
  return `LEDGERLAB-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}-${rand}`;
}
async function generateCertificate(){
  const nameEl = document.getElementById('certName');
  const name = nameEl.value.trim();
  if (!name){ alert('Please enter a name for the certificate.'); nameEl.focus(); return; }
  const certNo = makeCertNo();
  const dateStr = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'long', year:'numeric' });
  const score = readinessScore();
  const band = readinessBand(score);
  state.studentName = name;
  state.certificatesIssued.push({ certNo, name, date: dateStr, score, band });
  await saveState();
  render();
  openCertificateWindow(name, certNo, dateStr, score, band);
}

    .qrwrap{ margin-top:20px; display:flex; align-items:center; justify-content:center; gap:10px; }
    .qrnote{ font-size:10px; color:#5c5138; max-width:220px; text-align:left; }
    @media print{ body{ background:#fff; padding:0; } .cert{ box-shadow:none; border:2px solid #241f14; } .no-print{ display:none; } }
  </style></head><body>
  <div class="cert">
    <div class="brand">LedgerLab · by GBLN</div>

    <div class="meta">
      <div>Certificate No.<strong>${certNo}</strong></div>
      <div>Date of Issue<strong>${dateStr}</strong></div>

    </div>

    </div>
    <div class="qrwrap"><span class="qrnote">Self-contained verification block — encodes certificate number, name, and date. No central registry; scan to confirm these details match.</span></div>
    <p style="font-size:10px; color:#8a7c5c; margin-top:18px;">LedgerLab by GBLN · © 2026 Dr. Debasis Pahi · All rights reserved · drdpklass.github.io</p>

}

/* ==================== ENTRY GATE ==================== */
function renderGate(){
  const el = document.getElementById('gateOverlay');
  if (!el) return;
  if (state.gatePassed){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  const bothVisited = state.gateWebsiteVisited && state.gateLinkedinVisited;
  el.innerHTML = `
    <div class="gate-overlay">
      <div class="gate-card">
        <h2>Welcome to LedgerLab, by GBLN</h2>
        <p>Founded and copyrighted by <strong style="color:var(--text-light);">Dr. Debasis Pahi</strong>. This lab is 100% free to use — before you start, please visit both pages below (each opens in a new tab) to support his work. This is required once per device before "Enter the Lab" unlocks.</p>
        <div class="gate-links">
          <a href="https://drdpklass.github.io/" target="_blank" rel="noopener" id="gateWebsite" class="btn secondary">🌐 Visit Dr. Pahi's Website ↗</a>
          <a href="https://www.linkedin.com/in/dr-debasis-pahi-ph-d-8849a5103/" target="_blank" rel="noopener" id="gateLinkedin" class="btn secondary">🔗 Connect on LinkedIn ↗</a>
        </div>
        <p class="gate-hint ${bothVisited?'ok':''}" id="gateHintText">${bothVisited ? 'Thanks for connecting! "Enter the Lab" is unlocked below.' : 'Click both links above to unlock "Enter the Lab".'}</p>
        <button class="btn" id="gateEnterBtn" ${bothVisited?'':'disabled'}>Enter the Lab</button>
        <p style="font-size:10.5px; color:var(--muted-2); margin:14px 0 0;">© 2026 Dr. Debasis Pahi. All rights reserved.</p>
      </div>
    </div>
  `;
  const webLink = document.getElementById('gateWebsite');
  const liLink = document.getElementById('gateLinkedin');
  if (webLink) webLink.addEventListener('click', async () => { state.gateWebsiteVisited = true; await saveState(); renderGate(); });
  if (liLink) liLink.addEventListener('click', async () => { state.gateLinkedinVisited = true; await saveState(); renderGate(); });
  const enterBtn = document.getElementById('gateEnterBtn');
  if (enterBtn) enterBtn.addEventListener('click', async () => {
    if (!(state.gateWebsiteVisited && state.gateLinkedinVisited)) return;
    state.gatePassed = true;
    await saveState();
    renderGate();
  });
}
